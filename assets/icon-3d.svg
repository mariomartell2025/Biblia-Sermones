<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7eb8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a90e2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6ea8fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2e5c8a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5b9cfd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4a7a;stop-opacity:1" />
    </linearGradient>

    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-opacity="0.3" flood-color="#000000"/>
    </filter>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo sutil -->
  <circle cx="100" cy="100" r="95" fill="#ffffff" filter="url(#shadow)"/>

  <!-- Biblia 3D isométrica -->
  <g transform="translate(100, 100)">

    <!-- Parte trasera (sombra/profundidad) -->
    <path d="M -25 -30 L -20 -35 L 25 -35 L 30 -30 Z" fill="#1d4a7a" opacity="0.4"/>
    <path d="M 30 -30 L 30 30 L 35 25 L 35 -35 Z" fill="#1d4a7a" opacity="0.6"/>

    <!-- Lomo del libro (lateral izquierdo 3D) -->
    <path d="M -35 -30 L -30 -35 L -30 35 L -35 30 Z" fill="url(#grad2)"/>

    <!-- Cara frontal izquierda (página) -->
    <path d="M -30 -35 L 0 -35 L 0 35 L -30 35 Z" fill="url(#grad1)"/>

    <!-- Cara frontal derecha (página) -->
    <path d="M 0 -35 L 30 -30 L 30 30 L 0 35 Z" fill="#6ea8fe"/>

    <!-- Líneas de textura (páginas abiertas) -->
    <line x1="-25" y1="-28" x2="-5" y2="-28" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
    <line x1="-25" y1="-18" x2="-5" y2="-18" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
    <line x1="-25" y1="-8" x2="-5" y2="-8" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
    <line x1="-25" y1="2" x2="-5" y2="2" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
    <line x1="-25" y1="12" x2="-5" y2="12" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
    <line x1="-25" y1="22" x2="-5" y2="22" stroke="#ffffff" stroke-width="1" opacity="0.4"/>

    <!-- Líneas lado derecho -->
    <line x1="3" y1="-32" x2="25" y2="-27" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
    <line x1="3" y1="-20" x2="25" y2="-15" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
    <line x1="3" y1="-8" x2="25" y2="-3" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
    <line x1="3" y1="4" x2="25" y2="9" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
    <line x1="3" y1="16" x2="25" y2="21" stroke="#ffffff" stroke-width="1" opacity="0.3"/>

    <!-- Brillo/highlight superior -->
    <ellipse cx="-15" cy="-30" rx="8" ry="6" fill="#ffffff" opacity="0.3"/>
    <ellipse cx="15" cy="-28" rx="10" ry="5" fill="#ffffff" opacity="0.2"/>
  </g>

  <!-- Halo sutil de luz -->
  <circle cx="100" cy="95" r="70" fill="none" stroke="#6ea8fe" stroke-width="0.5" opacity="0.3"/>
</svg>
