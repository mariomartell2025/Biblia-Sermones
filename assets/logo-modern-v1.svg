<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo limpio -->
  <rect width="512" height="512" fill="#ffffff"/>

  <!-- Icono: Biblia minimalista -->
  <g transform="translate(176, 120)">
    <!-- Biblia abierta simplificada -->
    <path d="M 40 20 L 40 120 L 30 115 L 30 25 Q 30 20 40 20 M 40 20 L 160 20 Q 170 20 170 30 L 170 115 L 160 120 L 160 30 Q 160 25 150 25 L 40 25"
          fill="none" stroke="#6ea8fe" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Líneas de texto en páginas -->
    <line x1="50" y1="45" x2="100" y2="45" stroke="#6ea8fe" stroke-width="3" stroke-linecap="round"/>
    <line x1="50" y1="65" x2="95" y2="65" stroke="#9aa4b8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="50" y1="80" x2="98" y2="80" stroke="#9aa4b8" stroke-width="2.5" stroke-linecap="round"/>

    <line x1="120" y1="45" x2="155" y2="45" stroke="#6ea8fe" stroke-width="3" stroke-linecap="round"/>
    <line x1="120" y1="65" x2="160" y2="65" stroke="#9aa4b8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="120" y1="80" x2="158" y2="80" stroke="#9aa4b8" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Texto: BS -->
  <text x="256" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="96" font-weight="600" fill="#1d1d1f" text-anchor="middle">BS</text>

  <!-- Subtítulo -->
  <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="32" font-weight="500" fill="#6ea8fe" text-anchor="middle">Biblia + Sermones</text>
</svg>
